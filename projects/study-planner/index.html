<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Planner Pro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>📚 Study Planner Pro</h1>

        <p>
            Organize your assignments and stay ahead.
        </p>

        <div class="task-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter an assignment...">

            <button id="addTask">
                Add
            </button>

        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
